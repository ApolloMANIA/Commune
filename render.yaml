services:
  - type: web
    name: commune-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: rm -rf node_modules && npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ORIGIN
        sync: false

  - type: web
    name: commune-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        sync: false
